services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=INFO
    env_file: ./backend/.env
    depends_on: [postgres, redis]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    volumes: ["aura_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["aura_redis:/data"]
volumes:
  aura_postgres:
  aura_redis:

