name: Deploy AURA backend release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA with a successful Python control plane run
        required: true
        type: string
      resume_canary_deployment_id:
        description: Optional existing canary deployment ID for this exact release
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aura-production-backend-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: recovery-production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RESUME_CANARY_DEPLOYMENT_ID: ${{ inputs.resume_canary_deployment_id }}
      RAILWAY_PROJECT: 5d7502dc-9152-4f6d-b1e2-6fe3ba7fbf8c
      RAILWAY_ENVIRONMENT: 3f00203a-dff3-4808-9c6b-e18ea5912f48
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve the reviewed release runner before selecting source
        run: cp scripts/deploy_backend_release.py "$RUNNER_TEMP/aura-deploy-backend-release.py"
      - name: Require a tested main-branch release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'A full commit SHA is required.'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Python control plane" and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length > 0' \
            | python3 -c 'import sys; assert sys.stdin.read().strip() == "true", "Release needs successful main-branch backend CI"'
          git checkout --detach "$RELEASE_SHA"
      - name: Stamp immutable release identity
        run: |
          python3 -c 'import json, os, pathlib; pathlib.Path("backend/app/release.json").write_text(json.dumps({"sha": os.environ["RELEASE_SHA"]}))'
      - name: Require the existing production deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'The existing recovery-production RAILWAY_TOKEN secret is not configured.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3
      - name: Deploy canary, worker and API and require exact release readiness
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: aura-release-${{ github.run_id }}
        shell: bash
        run: python3 "$RUNNER_TEMP/aura-deploy-backend-release.py"
