name: Deploy AURA backend release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA with a successful Python control plane run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aura-production-backend-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: recovery-production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RAILWAY_PROJECT: 5d7502dc-9152-4f6d-b1e2-6fe3ba7fbf8c
      RAILWAY_ENVIRONMENT: 3f00203a-dff3-4808-9c6b-e18ea5912f48
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Require a tested main-branch release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'A full commit SHA is required.'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Python control plane" and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length > 0' \
            | python3 -c 'import sys; assert sys.stdin.read().strip() == "true", "Release needs successful main-branch backend CI"'
          git checkout --detach "$RELEASE_SHA"
      - name: Require the existing production deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'The existing recovery-production RAILWAY_TOKEN secret is not configured.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3
      - name: Deploy worker and API and require new successful deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: aura-release-${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          project = os.environ['RAILWAY_PROJECT']
          environment = os.environ['RAILWAY_ENVIRONMENT']
          release = os.environ['RELEASE_SHA']

          def deployments(service):
              raw = subprocess.check_output([
                  'railway', 'deployment', 'list', '--project', project,
                  '--environment', environment, '--service', service, '--json',
              ], text=True, timeout=60)
              data = json.loads(raw)
              return data if isinstance(data, list) else data['deployments']

          for name, service in [
              ('worker', '33c7fb6a-2fcd-446b-b8ff-969f6bcb93fd'),
              ('API', '4dae3f58-70dd-44e4-804f-e21441c4ec41'),
          ]:
              baseline = {item['id'] for item in deployments(service)}
              subprocess.run([
                  'railway', 'up', './backend', '--detach', '--project', project,
                  '--environment', environment, '--service', service,
                  '--message', f'AURA verified release {release} ({name})',
              ], check=True, timeout=180)
              deadline, new_id = time.monotonic() + 780, None
              while time.monotonic() < deadline:
                  fresh = [item for item in deployments(service) if item['id'] not in baseline]
                  if fresh:
                      new_id = new_id or fresh[0]['id']
                      deployment = next((item for item in fresh if item['id'] == new_id), None)
                      if deployment is None:
                          raise RuntimeError(f'{name}: deployment disappeared from history')
                      status = deployment['status']
                      print(f'{name}: {new_id} {status}', flush=True)
                      if status == 'SUCCESS':
                          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                              summary.write(f'- {name}: `{new_id}` SUCCESS; source `{release}`\n')
                          break
                      if status not in {'WAITING', 'QUEUED', 'INITIALIZING', 'BUILDING', 'DEPLOYING'}:
                          raise RuntimeError(f'{name}: deployment stopped with {status}')
                  time.sleep(15)
              else:
                  raise TimeoutError(f'{name}: no new successful deployment within 13 minutes')

          url = 'https://impartial-emotion-production-49d4.up.railway.app/ready'
          with urllib.request.urlopen(url, timeout=30) as response:
              assert response.status == 200, 'API readiness failed'
          print('API readiness passed; both services have new successful deployments.')
          PY
