name: Frontend validation
on:
  pull_request:
    paths: ["src/**", "tests/**", "scripts/check-website-simulation.mjs", "patches/**", "package*.json", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/check-website-simulation.mjs", "patches/**", "package*.json", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_AURA_API_URL: https://api.example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      - name: Check the complete website simulation in an isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check-website-simulation.mjs
      - name: Keep website simulation proof
        uses: actions/upload-artifact@v4
        with:
          name: aura-website-simulation-checks
          path: .website-simulation-proof/
