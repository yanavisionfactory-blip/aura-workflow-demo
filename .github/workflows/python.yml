name: Python control plane

on:
  # Run on every main commit: backend-release.yml requires a successful
  # main-branch Python control-plane run for the exact release SHA.
  # Path filtering left frontend-only releases permanently undeployable.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "browser_worker/**"
      - "scripts/deploy_backend_release.py"
      - "scripts/tests/test_backend_release.py"
      - "integrations/wordpress/**"
      - "docker-compose.yml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_test
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURA_TEST_POSTGRES_URL: postgresql+psycopg://aura:aura_test@localhost:5432/aura_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install video decoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test backend release recovery
        run: python -m unittest discover -s ../scripts/tests -p test_backend_release.py
      - name: Compile
        run: python -m compileall -q app
      - name: Lint
        run: ruff check --config pyproject.toml app tests ../scripts/deploy_backend_release.py ../scripts/tests/test_backend_release.py
      - name: Validate WordPress plugin bridge
        run: |
          php -l ../integrations/wordpress/aura-seo-bridge/aura-seo-bridge.php
          php ../integrations/wordpress/tests/bridge-test.php
      - name: Test
        run: pytest -q --junitxml=release-evaluation.xml
      - name: Preserve dependable pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependable-pilot-release-evidence
          path: backend/release-evaluation.xml
      - name: Evaluate isolated execution load
        run: python -m app.load_evaluation --report engine-load.json
      - name: Preserve engine load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-load-evaluation
          path: backend/engine-load.json
      - name: Preserve release evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-release-evaluation
          path: backend/release-evaluation.xml


  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build React client
        run: |
          npm test
          npm run build
        env:
          VITE_AURA_API_URL: https://api.example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder

  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser worker test dependencies
        run: pip install -r browser_worker/requirements.txt pytest pytest-asyncio httpx
      - name: Verify browser worker isolation and assistant response matching
        run: python -m pytest browser_worker -q
      - name: Build browser worker production image
        run: docker build -t aura-browser-worker:test browser_worker
      - name: Launch Chromium in the production image
        run: |
          docker run --rm --entrypoint python aura-browser-worker:test -c '
          import asyncio
          from playwright.async_api import async_playwright
          async def check():
              async with async_playwright() as runtime:
                  browser = await runtime.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
                  page = await browser.new_page()
                  await page.set_content("<h1>AURA browser ready</h1>")
                  assert await page.title() == ""
                  assert await page.locator("h1").inner_text() == "AURA browser ready"
                  await browser.close()
          asyncio.run(check())
          '
