name: Python control plane

on:
  push:
    branches: [python-control-plane, main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_test
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURA_TEST_POSTGRES_URL: postgresql+psycopg://aura:aura_test@localhost:5432/aura_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: pytest -q


  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build React client
        run: npm run build
        env:
          VITE_AURA_API_URL: https://api.example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
