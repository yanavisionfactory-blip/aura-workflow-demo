name: Python control plane

on:
  push:
    branches: [python-control-plane, main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: pytest -q
