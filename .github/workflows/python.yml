name: Python control plane

on:
  # Run on every main commit: backend-release.yml requires a successful
  # main-branch Python control-plane run for the exact release SHA.
  # Path filtering left frontend-only releases permanently undeployable.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "integrations/wordpress/**"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura_test
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURA_TEST_POSTGRES_URL: postgresql+psycopg://aura:aura_test@localhost:5432/aura_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Lint
        run: ruff check app tests
      - name: Validate WordPress plugin bridge
        run: |
          php -l ../integrations/wordpress/aura-seo-bridge/aura-seo-bridge.php
          php ../integrations/wordpress/tests/bridge-test.php
      - name: Test
        run: pytest -q --junitxml=release-evaluation.xml
      - name: Evaluate isolated execution load
        run: python -m app.load_evaluation --report engine-load.json
      - name: Preserve engine load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-load-evaluation
          path: backend/engine-load.json
      - name: Preserve release evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-release-evaluation
          path: backend/release-evaluation.xml


  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build React client
        run: |
          npm test
          npm run build
        env:
          VITE_AURA_API_URL: https://api.example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
