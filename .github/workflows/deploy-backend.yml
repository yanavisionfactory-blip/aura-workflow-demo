name: Validate AURA backend release

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-production-backend
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Compile and test
        working-directory: backend
        run: |
          python -m compileall -q app
          pytest -q

  # Railway's installed GitHub integration owns production deployment and
  # publishes one commit status per service. Keeping a second CLI deployment
  # here required duplicate secrets and produced false-red releases even after
  # the exact commit was already healthy in production.
