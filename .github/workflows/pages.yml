name: Deploy AURA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Frontend Vite variables are injected at build time from GitHub Actions secrets.
# The deployment always publishes the latest production control-plane frontend.
# Release: human-friendly execution and automatic recovery.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production application
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_AURA_API_URL: https://impartial-emotion-production-49d4.up.railway.app
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_AURA_BUILD_SHA: ${{ github.sha }}
      - name: Render captioned website-content walkthrough
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          node scripts/capture-website-walkthrough.mjs
          node scripts/check-website-simulation.mjs
          python3 scripts/build-website-walkthrough.py .walkthrough-frames --output dist/showcase/website-content/walkthrough.mp4
          cp .walkthrough-frames/scene-04.jpg dist/showcase/website-content/walkthrough-poster.jpg
      - name: Keep the walkthrough video for review
        uses: actions/upload-artifact@v4
        with:
          name: aura-website-content-video
          path: |
            dist/showcase/website-content/walkthrough.mp4
            dist/showcase/website-content/walkthrough.vtt
            dist/showcase/website-content/walkthrough-poster.jpg
      - name: Keep website simulation checks and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aura-website-simulation-checks
          path: .website-simulation-proof/
      - name: Support saved results deep links
        run: cp dist/index.html dist/404.html
      - name: Publish build version
        run: printf '%s\n' "$GITHUB_SHA" > dist/version.txt
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
