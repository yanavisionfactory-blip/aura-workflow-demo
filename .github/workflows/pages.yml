name: Deploy AURA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Frontend Vite variables are injected at build time from GitHub Actions secrets.
# The deployment always publishes the latest production control-plane frontend.
# Release: human-friendly execution and automatic recovery.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # Set this repository variable after the new API passes /ready.
          # Leaving it unset preserves the current production endpoint.
          VITE_AURA_API_URL: ${{ vars.AURA_API_URL || 'https://impartial-emotion-production-49d4.up.railway.app' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_AURA_BUILD_SHA: ${{ github.sha }}
      - name: Reuse unchanged published walkthrough
        id: walkthrough
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://yanavisionfactory-blip.github.io/aura-workflow-demo"
          published_build="$(curl --fail --silent --show-error --max-time 20 "$site_url/version.txt?for=$GITHUB_SHA")" || exit 0
          if [[ ! "$published_build" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$published_build^{commit}"; then exit 0; fi
          # The public walkthrough has its own entry point. Native workflow pages
          # and these commerce-only modules do not participate in its rendering.
          if ! git diff --quiet "$published_build" HEAD -- src public package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js scripts/capture-website-walkthrough.mjs scripts/build-website-walkthrough.py ':!src/App.jsx' ':!src/pages/Demo.jsx' ':!src/pages/DeliveryResults.jsx' ':!src/pages/CommerceToolsWorkflow.jsx' ':!src/components/aura/CommerceToolsResult.jsx' ':!src/lib/commerceToolContract.mjs' ':!src/lib/commerceToolWorkflow.mjs'; then exit 0; fi
          cached_media="$(mktemp -d)"
          for asset in walkthrough.mp4 walkthrough.vtt walkthrough-poster.jpg; do
            curl --fail --silent --show-error --location --max-time 45 "$site_url/showcase/website-content/$asset?build=$published_build" -o "$cached_media/$asset" || exit 0
            test -s "$cached_media/$asset" || exit 0
          done
          python3 - "$cached_media" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert (root / "walkthrough.mp4").read_bytes()[4:8] == b"ftyp"
          assert (root / "walkthrough.vtt").read_text().startswith("WEBVTT")
          assert (root / "walkthrough-poster.jpg").read_bytes().startswith(b"\xff\xd8")
          PY
          mkdir -p dist/showcase/website-content
          cp "$cached_media/"* dist/showcase/website-content/
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Reused published walkthrough from $published_build; its rendering sources are unchanged."
      - name: Install walkthrough renderer
        if: steps.walkthrough.outputs.reused != 'true'
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install walkthrough browser
        if: steps.walkthrough.outputs.reused != 'true'
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
      - name: Install video encoder
        if: steps.walkthrough.outputs.reused != 'true'
        timeout-minutes: 3
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture and check website demo screens
        if: steps.walkthrough.outputs.reused != 'true'
        timeout-minutes: 3
        run: node scripts/capture-website-walkthrough.mjs
      - name: Encode captioned website-content walkthrough
        if: steps.walkthrough.outputs.reused != 'true'
        timeout-minutes: 3
        run: |
          python3 scripts/build-website-walkthrough.py .walkthrough-frames --output dist/showcase/website-content/walkthrough.mp4
          cp .walkthrough-frames/scene-04.jpg dist/showcase/website-content/walkthrough-poster.jpg
      - name: Keep the walkthrough video for review
        uses: actions/upload-artifact@v4
        with:
          name: aura-website-content-video
          path: |
            dist/showcase/website-content/walkthrough.mp4
            dist/showcase/website-content/walkthrough.vtt
            dist/showcase/website-content/walkthrough-poster.jpg
      - name: Support saved results deep links
        run: cp dist/index.html dist/404.html
      - name: Publish build version
        run: printf '%s\n' "$GITHUB_SHA" > dist/version.txt
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
