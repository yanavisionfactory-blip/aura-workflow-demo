name: Website demo interaction checks
on:
  pull_request:
    paths:
      - "src/showcase/website-content/**"
      - "src/components/aura/WebsiteContentResult.jsx"
      - "src/components/aura/SimulatedCMSScreen.jsx"
      - "scripts/capture-website-walkthrough.mjs"
      - "tests/website*.test.mjs"
      - ".github/workflows/website-demo.yml"
      - ".github/workflows/pages.yml"
      - "scripts/build-website-walkthrough.py"
permissions:
  contents: read
jobs:
  website-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: node --test tests/websiteContentEdits.test.mjs tests/websiteShowcase.test.mjs
      - run: python3 -m py_compile scripts/build-website-walkthrough.py
      - run: npm run build
        env:
          VITE_AURA_API_URL: https://api.example.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: google-chrome --version
      - run: node scripts/capture-website-walkthrough.mjs
        timeout-minutes: 3
        env:
          AURA_BROWSER_CHANNEL: chrome
      - name: Install bundled video encoder
        timeout-minutes: 3
        run: |
          python3 -m venv .walkthrough-runtime
          .walkthrough-runtime/bin/pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Check captioned video encoding
        timeout-minutes: 3
        run: |
          encoder_path="$(.walkthrough-runtime/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python3 scripts/build-website-walkthrough.py .walkthrough-frames --output dist/showcase/website-content/walkthrough.mp4 --ffmpeg "$encoder_path"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-demo-review-screens
          path: .walkthrough-frames/
          include-hidden-files: true
